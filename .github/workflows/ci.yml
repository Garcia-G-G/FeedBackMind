name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: feedbackmind
          POSTGRES_PASSWORD: password
          POSTGRES_DB: feedbackmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://feedbackmind:password@localhost:5432/feedbackmind_test
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-fake-key
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_test_fake
      STRIPE_STARTER_PRICE_ID: price_test_starter
      STRIPE_GROWTH_PRICE_ID: price_test_growth
      STRIPE_SCALE_PRICE_ID: price_test_scale

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true

      - name: Setup database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bundle exec rspec --format documentation

      - name: Security scan
        run: bundle exec brakeman -q --no-pager
