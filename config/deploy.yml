service: feedbackmind

image: ghcr.io/garcia-g-g/feedbackmind

servers:
  web:
    hosts:
      - 5.161.238.195
  worker:
    hosts:
      - 5.161.238.195
    cmd: bundle exec sidekiq -C config/sidekiq.yml

proxy:
  ssl: true
  host: 5.161.238.195.sslip.io
  app_port: 3000
  healthcheck:
    path: /up
    interval: 10
    timeout: 60

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    RUBY_VERSION: 3.3.8

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_MAX_THREADS: "5"
    APP_HOST: "5.161.238.195.sslip.io"
    APP_PROTOCOL: "https"
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - REDIS_URL
    - OPENAI_API_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_PUBLISHABLE_KEY
    - STRIPE_WEBHOOK_SECRET
    - STRIPE_STARTER_PRICE_ID
    - STRIPE_GROWTH_PRICE_ID
    - STRIPE_SCALE_PRICE_ID
    - SLACK_CLIENT_ID
    - SLACK_CLIENT_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - INTERCOM_CLIENT_ID
    - INTERCOM_CLIENT_SECRET
    - JIRA_CLIENT_ID
    - JIRA_CLIENT_SECRET
    - TYPEFORM_CLIENT_ID
    - TYPEFORM_CLIENT_SECRET
    - POSTMARK_API_KEY
    - RESEND_API_KEY

accessories:
  db:
    image: pgvector/pgvector:pg16
    host: 5.161.238.195
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: feedbackmind_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: 5.161.238.195
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data

ssh:
  user: root
  keys:
    - ~/.ssh/feedbackmind_hetzner
